# CN & Scaler Session 4 — one nginx.conf, five demos, five ports.
#
#   mkdir -p logs temp
#   nginx -p $PWD -c $PWD/nginx.conf -g 'daemon off;'
#   # reload after edits, without dropping a connection:
#   nginx -p $PWD -c $PWD/nginx.conf -s reload
#
# The reload is worth pausing on. nginx does not restart. The master parses
# the new config, forks NEW workers with it, tells the old workers to stop
# accepting, and lets them finish the requests they already have. Zero dropped
# connections, two generations of workers alive at once. Watch it:
#   watch -n0.2 'ps -o pid,ppid,etime,args -C nginx'
#   src/os/unix/ngx_process_cycle.c  ngx_master_process_cycle()  (~L74)

worker_processes  auto;      # = number of cores. One process, one core, one
                             # event loop. NOT one process per connection.
                             # ngx_start_worker_processes()  (~L358)

daemon off;
error_log  logs/error.log  info;
pid        logs/nginx.pid;

events {
    worker_connections  4096;   # per worker. Total = workers x this.
                                # Each one is a pre-allocated struct, not a
                                # thread and not a process.
                                # ngx_event_process_init()  (~L636)

    # use epoll;                # nginx picks the best available; on Linux
                                # that is epoll. Force `select` here and
                                # re-run the flood to feel 03-select again.

    multi_accept off;           # on = drain the accept queue in one wakeup.
                                # ngx_event_accept()  (~L21)

    accept_mutex off;           # default since 1.11.3. With SO_REUSEPORT or
                                # EPOLLEXCLUSIVE the kernel does the fan-out,
                                # so the userspace mutex is dead weight.
                                # ngx_process_events_and_timers()  (~L195)
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    # A log_format that shows the things this session is about. Default
    # `combined` hides all of it. $upstream_addr is how you SEE round robin;
    # $upstream_cache_status is how you see the cache; $request_time minus
    # $upstream_response_time is time nginx itself spent (usually ~0, and when
    # it is not, you have found your problem).
    log_format  demo  '$remote_addr "$request" $status '
                      'upstream=$upstream_addr cache=$upstream_cache_status '
                      'rt=$request_time urt=$upstream_response_time '
                      'sent=$body_bytes_sent';

    access_log  logs/access.log  demo;
    client_body_temp_path  temp/client;
    proxy_temp_path        temp/proxy;
    fastcgi_temp_path      temp/fastcgi;
    proxy_cache_path       temp/cache levels=1:2 keys_zone=demo:10m
                           max_size=100m inactive=60s use_temp_path=off;
    # keys_zone=demo:10m  — 10 MB of SHARED MEMORY holding the LRU + rbtree of
    #                        keys. ~8000 keys per megabyte. This is the index,
    #                        not the data; the data is on disk under temp/cache.
    # inactive=60s        — evicted if not READ for 60s, regardless of TTL.
    # max_size=100m       — the cache manager evicts from the LRU tail to stay
    #                        under this. ngx_http_file_cache_expire()  (~L1860)
    #                        `q = ngx_queue_last(&cache->sh->queue);`  <- the
    #                        tail of an intrusive doubly-linked list. That one
    #                        line is the entire LRU.

    #-------------------------------------------------------------------
    # 1. STATIC + SENDFILE                                    :8080
    #-------------------------------------------------------------------
    server {
        listen 8080;
        server_name  static.local;
        root ../www;

        sendfile      on;   # permission to use sendfile(2), not an order.
                            # ngx_linux_sendfile_chain()  (~L50)
        tcp_nopush    on;   # TCP_CORK: headers and first body bytes in one
                            # segment. Only meaningful WITH sendfile.
        tcp_nodelay   on;   # disables Nagle on keep-alives. nginx flips
                            # between CORK and NODELAY; they are mutually
                            # exclusive and the code says so out loud.

        open_file_cache          max=1000 inactive=20s;
        open_file_cache_valid    30s;
        open_file_cache_min_uses 2;
        open_file_cache_errors   on;
        # Caches the open fd + stat + directory lookup. On a hot static site
        # this removes the open()/fstat() from the request path entirely.
        # src/core/ngx_open_file_cache.c

        # Turn sendfile off, restart, and diff `strace -c -p <worker>`:
        #   sendfile on  -> sendfile(2)
        #   sendfile off -> read(2) + writev(2), forever
    }

    #-------------------------------------------------------------------
    # 2. ROUTING — location matching, in precedence order       :8081
    #-------------------------------------------------------------------
    server {
        listen 8081;
        root ../www;

        # nginx checks locations in a FIXED order that has nothing to do with
        # the order you wrote them in:
        #   1.  location =  /exact          exact match, wins immediately
        #   2.  location ^~ /prefix         longest prefix, stops regex search
        #   3.  location ~  /regex          regex, FIRST match in file order
        #       location ~* /regex          same, case-insensitive
        #   4.  location    /prefix         longest prefix, used if no regex hit
        #
        # Prefixes live in a static tree built at config-parse time and walked
        # per request; regexes are a plain array walked in order. That is why
        # 200 prefix locations are cheap and 200 regex locations are not.
        #   ngx_http_core_find_location()         (~L1446)
        #   ngx_http_core_find_static_location()  (~L1542)  <- the tree walk

        location = /exact      { return 200 "1: exact match\n"; }
        location ^~ /images/   { return 200 "2: prefix, regex skipped\n"; }
        location ~ \.php$      { return 200 "3: regex\n"; }
        location /             { return 200 "4: catch-all prefix\n"; }

        # Try these and predict the answer BEFORE you press enter:
        #   curl :8081/exact          curl :8081/images/a.php
        #   curl :8081/other/a.php    curl :8081/anything

        # Compare with Apache, which evaluates <Directory>, <Location> and
        # <Files> in a documented merge order and where .htaccess is consulted
        # per-directory per-request. nginx has no .htaccess. That is not a
        # missing feature; it is the reason nginx does not stat() its way up
        # the tree on every request.
    }

    #-------------------------------------------------------------------
    # 3. REVERSE PROXY + CACHE + LOAD BALANCE                   :8082
    #-------------------------------------------------------------------
    upstream app {
        # Weighted round robin. nginx's is the SMOOTH variety: rather than
        # emitting aaab for weights 3:1, it spreads them as abaa. The whole
        # algorithm is ten lines:
        #     peer->current_weight += peer->effective_weight;
        #     total += peer->effective_weight;
        #     if (best == NULL || peer->current_weight > best->current_weight)
        #         best = peer;
        #     ...
        #     best->current_weight -= total;
        #   ngx_http_upstream_get_peer()  (~L811)
        #
        # effective_weight is knocked down when a peer errors and creeps back
        # up on success — passive health checking, no extra probe traffic.
        server 127.0.0.1:8004 weight=3 max_fails=2 fail_timeout=10s;  # epolld
        server 127.0.0.1:8001 weight=1 max_fails=2 fail_timeout=10s;  # forkd
        server 127.0.0.1:8003 backup;                                 # selectd

        keepalive 32;   # POOLED upstream connections. Without this every
                        # proxied request does a fresh three-way handshake to
                        # the backend. Session 3's "amortise the setup", again.
    }

    server {
        listen 8082;

        location / {
            proxy_cache            demo;
            proxy_cache_key        "$scheme$request_method$host$request_uri";
            proxy_cache_valid      200 302  10s;
            proxy_cache_valid      404       1m;
            proxy_cache_lock       on;    # ONE request goes to the origin on a
                                          # miss; the rest wait for it. This is
                                          # the anti-stampede switch and it is
                                          # off by default.
            proxy_cache_use_stale  error timeout updating
                                   http_500 http_502 http_503 http_504;
                                          # serve stale rather than fail. The
                                          # single most valuable line in this
                                          # file at 3am.
            add_header X-Cache-Status $upstream_cache_status;   # HIT/MISS/EXPIRED/
                                          # STALE/UPDATING/BYPASS/REVALIDATED

            proxy_pass       http://app;
            proxy_http_version 1.1;
            proxy_set_header Connection "";      # required for `keepalive` to
                                                 # actually work upstream
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # Those four headers exist because the moment you put a proxy in
            # front of an app, the app loses the client. Everything downstream
            # — rate limiting, geo, audit logs, TLS redirects — is now reading
            # a header it has to trust. Ask the class who is allowed to set
            # X-Forwarded-For and watch the room go quiet.

            proxy_connect_timeout 2s;
            proxy_read_timeout    10s;
            proxy_next_upstream   error timeout http_502 http_503;
        }

        # curl -i :8082/  twice in a row and read X-Cache-Status.
        # Then: for i in $(seq 20); do curl -s :8082/nocache$i >/dev/null; done
        # and count which upstream got what — the 3:1 split should show up in
        # the two servers' own logs.
    }

    #-------------------------------------------------------------------
    # 4. FASTCGI — to our own 200-line responder                :8083
    #-------------------------------------------------------------------
    server {
        listen 8083;
        root ../www;

        location / {
            fastcgi_pass   127.0.0.1:9000;    # ../06-fastcgi/fcgi_responder
            fastcgi_index  index.php;

            # These become FCGI_PARAMS records — the CGI environment, sent as
            # length-prefixed name/value pairs instead of via environ.
            #   ngx_http_fastcgi_create_request()  (~L858)
            fastcgi_param  SCRIPT_FILENAME  $document_root$fastcgi_script_name;
            fastcgi_param  QUERY_STRING     $query_string;
            fastcgi_param  REQUEST_METHOD   $request_method;
            fastcgi_param  CONTENT_TYPE     $content_type;
            fastcgi_param  CONTENT_LENGTH   $content_length;
            fastcgi_param  REQUEST_URI      $request_uri;
            fastcgi_param  SERVER_PROTOCOL  $server_protocol;
            fastcgi_param  REMOTE_ADDR      $remote_addr;
            fastcgi_param  SERVER_SOFTWARE  nginx/$nginx_version;
        }
        # Run the responder in one terminal and curl :8083/hello?a=1 here.
        # The responder prints every record it receives. That printout and
        # ngx_http_fastcgi_process_record() (~L2742) are the same state machine
        # written twice.
    }

    #-------------------------------------------------------------------
    # 5. FALLBACKS — try_files, and why WordPress works          :8084
    #-------------------------------------------------------------------
    server {
        listen 8084;
        root ../www;

        location / {
            # "Is this a real file? A real directory? No? Then hand the whole
            #  URI to the app as a query string and let it route."
            # Every framework's pretty-URL support is this one line.
            try_files $uri $uri/ /index.html?$args;
            #   ngx_http_try_files_handler()  (~L79)
            #   It stat()s each candidate through the open-file cache and
            #   rewrites the URI to the LAST entry if none exist. The last
            #   entry is the only one that is not tested — it is the fallback,
            #   not a candidate.
        }

        location /maybe/ {
            # Fallback across a network boundary: try disk, then the upstream.
            try_files $uri @app;
        }
        location @app {            # a NAMED location: reachable only from
            proxy_pass http://app; # try_files / error_page, never from a URL
        }

        error_page 502 503 504 /down.html;
        location = /down.html { internal; }
        # Stop all three upstreams and watch this fire.
    }
}
